# Front estático (SPA) + proxy de /api al backend, con nginx como puerta única de sesión:
# cada petición pasa por auth_request → GET /api/acceso/verificar (cookie firmada, ver
# audit_agent/acceso.py). Sin sesión, la SPA responde con la pantalla de login EN LA MISMA
# URL (redirect interno error_page 401), y /api devuelve 401 a secas.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subidas grandes (papeles de trabajo en Excel y vídeos de reunión, de los que solo
    # se envía a KAIA el audio extraído) y acciones con modelo que tardan minutos.
    client_max_body_size 1g;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/acceso/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Públicos: la pantalla de login y el propio login.
    location = /acceso.html { try_files $uri =404; }
    location = /api/acceso/login {
        proxy_pass http://backend:8000/api/acceso/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /_auth;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /assets/ {
        auth_request /_auth;
        error_page 401 = /acceso.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        auth_request /_auth;
        error_page 401 = /acceso.html;
        try_files $uri $uri/ /index.html;
    }
}
