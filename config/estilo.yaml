# ============================================================
# Configuración de estilo corporativo del informe de auditoría
# Este fichero es EL punto de mantenimiento del criterio de estilo.
# Los auditores pueden ampliarlo sin tocar código.
# ============================================================

# Palabras/expresiones prohibidas en informes.
# "sugerencia" es lo que el agente propone como sustitución.
palabras_prohibidas:
  - termino: "fallo"
    sugerencia: "debilidad / incidencia"
    motivo: "Lenguaje culpabilizador; el informe describe hechos, no culpas."
  - termino: "culpa"
    sugerencia: "(reformular de forma neutra, orientada al proceso)"
    motivo: "Lenguaje culpabilizador."
  - termino: "error del responsable"
    sugerencia: "debilidad en el proceso de revisión"
    motivo: "Las observaciones se orientan a proceso, no a personas."
  - termino: "negligencia"
    sugerencia: "(describir el hecho objetivo)"
    motivo: "Juicio de valor con posibles implicaciones legales."
  - termino: "fraude" #Ojo revisar para auditorias de fraude (Rirsgos de fraude si aplica en alguna auditoria)
    sugerencia: "indicios que requieren análisis adicional"
    motivo: "Calificación reservada; requiere validación de Dirección/Legal."
  - termino: "grave"
    sugerencia: "de riesgo alto (salvo usos como «incidente grave» en descripciones de proceso)"
    motivo: "La severidad de una conclusión se expresa con la escala de riesgo (Crítico/Alto/Medio/Bajo)."
  - termino: "nunca"
    sugerencia: "no se ha identificado evidencia de que…"
    motivo: "Absolutos no soportables con la evidencia de una muestra."
  - termino: "siempre"
    sugerencia: "en los casos analizados…"
    motivo: "Absolutos no soportables con la evidencia de una muestra."
  - termino: "todos los casos"
    sugerencia: "la totalidad de la muestra analizada"
    motivo: "Acotar la afirmación al alcance de la prueba."
  - termino: "creemos"
    sugerencia: "consideramos / se ha observado"
    motivo: "Las valoraciones del equipo se expresan con «consideramos» o en impersonal, no como creencia."
  - termino: "pensamos"
    sugerencia: "consideramos"
    motivo: "Las valoraciones del equipo se expresan con «consideramos»."
  - termino: "obviamente"
    sugerencia: "(eliminar)"
    motivo: "Muletilla valorativa sin aporte."
  - termino: "evidentemente"
    sugerencia: "(eliminar)"
    motivo: "Muletilla valorativa sin aporte."
  - termino: "problema"
    sugerencia: "observación / debilidad"
    motivo: "Terminología estándar del informe."
  - termino: "mal hecho"
    sugerencia: "no conforme con el criterio establecido"
    motivo: "Redacción objetiva contra criterio."

# Primera persona.
# Calibrado con informes aprobados (docs/ESTILO_INFORMES.md): las actuaciones del equipo
# auditor SÍ se narran en primera persona del plural («hemos revisado», «durante nuestra
# revisión», «validamos», «consideramos»); los hechos, en impersonal. Solo se avisa del
# singular, que no aparece en los informes aprobados.
primera_persona:
  - "yo"
  - "considero"
  - "opino"
  - "creo"

# ------------------------------------------------------------------
# Tono y lenguaje (instrucciones del departamento, agosto 2026).
# Se inyectan en todos los prompts de redacción y `revisar` las señala como AVISO (nunca error):
# la guía pide cuestionar cada caso según el contexto, no sustituir en automático. `corregir --avisos`
# se las pasa al modelo con la alternativa propuesta. Editable sin tocar código.
tono:
  principios:
    - "Evita lenguaje que pueda percibirse como acusatorio, excesivamente rotundo, defensivo, alarmista, innecesariamente negativo o artificial/exageradamente positivo."
    - "No apliques las sustituciones de forma automática: evalúa el contexto. Una formulación directa puede ser necesaria por precisión técnica, relevancia regulatoria o severidad del hallazgo."
    - "Evita transmitir que algo debe crearse desde cero cuando procede reforzar, completar, homogeneizar, documentar o monitorizar mecanismos existentes."
  # Expresiones a cuestionar (aviso en `revisar`), con la fórmula constructiva que las suele sustituir.
  expresiones_a_cuestionar:
    - termino: "falta de"
      alternativa: "se han identificado oportunidades de mejora en… / se han observado debilidades en…"
    - termino: "ausencia de"
      alternativa: "la evidencia disponible no permite confirmar que… / el mecanismo actual podría completarse con…"
    - termino: "no hay"
      alternativa: "no hemos observado evidencias suficientes que permitan confirmar…"
    - termino: "no existe"
      alternativa: "se han observado oportunidades de mejora en… / la evidencia disponible no permite confirmar que… se aplique de forma homogénea"
    - termino: "no existen"
      alternativa: "se han observado oportunidades de mejora en… / la evidencia disponible no permite confirmar que…"
    - termino: "no se cuenta con"
      alternativa: "el proceso podría reforzarse mediante…"
    - termino: "no se dispone de"
      alternativa: "la evidencia disponible no permite concluir que…"
    - termino: "no se ha identificado ningún"
      alternativa: "no hemos observado evidencias suficientes que permitan confirmar…"
    - termino: "no se ha identificado ninguna"
      alternativa: "no hemos observado evidencias suficientes que permitan confirmar…"
    - termino: "incumplimiento total"
      alternativa: "precisar el alcance real del incumplimiento observado (casos, muestra, periodo)"
    - termino: "sin control"
      alternativa: "control con oportunidades de mejora en su diseño, ejecución o documentación"
    - termino: "inadecuado"
      alternativa: "con oportunidades de mejora en… (cuando sea más preciso)"
    - termino: "inadecuada"
      alternativa: "con oportunidades de mejora en… (cuando sea más preciso)"
  formulas_constructivas:
    - "se han identificado oportunidades de mejora en…"
    - "se han observado debilidades en…"
    - "la evidencia disponible no permite concluir que…"
    - "no hemos observado evidencias suficientes que permitan confirmar…"
    - "el proceso podría reforzarse mediante…"
    - "el mecanismo actual podría completarse con…"
    - "se recomienda reforzar…"
    - "se considera conveniente mejorar…"
    - "la implantación de estas medidas permitiría reforzar…"
    - "el modelo actual presenta margen de mejora en…"
  # Absolutos y formulaciones excesivas: precisar el alcance real (casos concretos, muestra, subconjunto).
  absolutos:
    criterio: "Cuestiona afirmaciones absolutas cuando puedan transmitir que la debilidad es mayor o afecta a toda la población cuando se han observado casos concretos, una muestra o un subconjunto; introduce precisión sobre el alcance real."
    ejemplos:
      - antes: "La implantación efectiva de estas medidas permitiría mitigar los riesgos reputacionales y de cumplimiento."
        despues: "La implantación efectiva de estas medidas permitiría reforzar la mitigación de los riesgos reputacionales y de cumplimiento."
      - antes: "Establecer un mecanismo que regule la elaboración, revisión y aprobación de las comunicaciones."
        despues: "Mejorar el mecanismo de elaboración, revisión y aprobación de las comunicaciones."
      - antes: "No existe un proceso de revisión."
        despues: "Se han observado oportunidades de mejora en el proceso de revisión / La evidencia disponible no permite confirmar que el proceso de revisión se esté aplicando de forma homogénea."
  # Adjetivos calificativos innecesarios (aviso): subjetividad o intensificación sin evidencia adicional.
  adjetivos_a_cuestionar:
    - termino: "clara"
      alternativa: "«establecer una asignación de responsabilidades clara» → «definir la asignación de responsabilidades»"
    - termino: "claro"
      alternativa: "eliminar si no aporta precisión"
    - termino: "significativas"
      alternativa: "solo si la significatividad está soportada por impacto, severidad o evidencia"
    - termino: "significativo"
      alternativa: "solo si está soportado por impacto, severidad o evidencia"
    - termino: "significativa"
      alternativa: "solo si está soportada por impacto, severidad o evidencia"
    - termino: "control inadecuado"
      alternativa: "control con oportunidades de mejora en su diseño, ejecución o documentación"
  tiempos_verbales:
    - "Objetivo y alcance de la auditoría: en pasado o pretérito perfecto cuando describan el trabajo realizado."
    - "Presente para conclusiones vigentes."
    - "Pasado para procedimientos realizados, evidencias obtenidas y hechos observados durante la revisión."
    - "Futuro o condicional solo para planes de acción, próximos pasos o efectos esperados."
    - "No mezclar presente, pasado y futuro sin justificación."

# Reglas cuantitativas
# Extensión orientativa (palabras): el informe se lee en diapositivas y la letra debe caber.
# Se inyecta en los prompts; `condensar` acorta un informe ya escrito respetando hechos y cifras.
extension:
  intro_bloque: 70          # cada bloque de la introducción (Contexto, Objetivo, Riesgos, Alcance)
  resumen_total: 260        # resumen ejecutivo completo
  resumen_vineta: 35        # cada viñeta de conclusión del resumen
  incidencia: 110           # cuerpo en prosa de la conclusión (deber ser + identificado)
  causa_raiz: 45
  detalle_vineta: 30        # cada viñeta de «detalles descriptivos»
  detalles_max: 5           # número máximo de viñetas de detalles
  consecuencias: 70
  recomendacion: 60         # solo cuando la propone el modelo (la del auditor no se toca)

reglas:
  longitud_maxima_frase: 55        # palabras por frase (aviso). Los aprobados admiten frases largas bien puntuadas
  requiere_nivel_riesgo: true      # toda conclusión debe tener nivel de riesgo
  niveles_riesgo_validos: ["Crítico", "Alto", "Medio", "Bajo"]
  escala_evaluacion_global: ["Deficiente", "Insuficiente", "Mejorable", "Razonable", "Adecuado"]

# Estructura exigible a cada conclusión del detalle de conclusiones
# (incidencia -> causa raíz -> cómo se ha llegado -> consecuencias -> recomendación).
# `requerido: false` = se avisa si falta, pero no es error hasta redactar el informe.
estructura_conclusion:
  - campo: "titulo"
    descripcion: "Título breve de la incidencia"
    requerido: true
  - campo: "incidencia"
    descripcion: "Qué incidencia se ha detectado (hecho objetivo, con datos del papel de trabajo)"
    requerido: true
  - campo: "causa_raiz"
    descripcion: "Por qué ha pasado (causa raíz inferida del papel de trabajo)"
    requerido: true
  - campo: "como_se_ha_llegado"
    descripcion: "Cómo se ha llegado a ella (procedimiento, datos, tablas)"
    requerido: true
  - campo: "consecuencias"
    descripcion: "Consecuencia o consecuencias de la incidencia"
    requerido: true
  - campo: "recomendacion"
    descripcion: "Recomendación (aportada por el auditor o propuesta con `recomendar`)"
    requerido: false
  - campo: "nivel_riesgo"
    descripcion: "Alto / Medio / Bajo"
    requerido: false
