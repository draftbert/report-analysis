# Producción: backend (API + CLI) y front (nginx). Variables en .env.defaults / .env.secrets (ver run.sh).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: revisor-informes/backend:${VERSION:-latest}
    container_name: revisor-backend
    labels:
      glance.parent: revisor
      glance.name: API
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # uid/gid del host (los exporta run.sh)
    env_file:
      - .env.defaults
      - .env.secrets
    volumes:
      - ./expedientes:/app/expedientes          # datos de trabajo: documentos, informes, historial, trazas, salidas
      - ./config:/app/config                    # criterio de estilo (editable desde la web: /reglas), textos fijos, plantilla PPT
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    image: revisor-informes/frontend:${VERSION:-latest}
    container_name: revisor-frontend
    labels:
      glance.id: revisor
      glance.name: Revisor de informes
      glance.icon: mdi:file-document-check-outline
      glance.url: http://revisor.suei.ro
      glance.description: Revisión de informes de auditoría con KAIA
      glance.category: Auditoría
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}                 # logs de nginx en hora local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8080}:80"
    networks:
      - proxy
      - default

networks:
  proxy:
    external: true
