# Desarrollo: código montado en los contenedores, recarga automática en back (uvicorn --reload)
# y en front (vite). Front en http://localhost:${FRONT_PORT:-3030}, API en http://localhost:${API_PORT:-8000}.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: revisor-informes/backend:dev
    container_name: revisor-backend-dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # uid/gid del host (los exporta run.sh)
    env_file:
      - .env.defaults
      - .env.secrets
    volumes:
      - ./audit_agent:/app/audit_agent
      - ./config:/app/config
      - ./ejemplos:/app/ejemplos
      - ./tests:/app/tests
      - ./expedientes:/app/expedientes
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["python", "-m", "uvicorn", "audit_agent.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-alpine
    container_name: revisor-frontend-dev
    working_dir: /app
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONT_PORT:-3030}:3030"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3030"

volumes:
  frontend_node_modules:
